# Own dataset round 3 (spec/own-dataset-training.md §8): the 30 m PlanetScope window (9x9 at 3.33 m, conv encoder),
# alone and with the flat 3x3 sub-grid, 3 seeds, 192 units. 12 pods x 4; 20 Gi for the window stacks (3.4 GB, page
# cache shared by the 4 runs). No credentials inside.
apiVersion: batch/v1
kind: Job
metadata:
  name: smatousi-yieldsat-protocol-own3
spec:
  completions: 12
  parallelism: 12
  backoffLimit: 1000
  ttlSecondsAfterFinished: 604800
  template:
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values: [NVIDIA-A10, NVIDIA-GeForce-RTX-3090, NVIDIA-GeForce-RTX-4090]
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                - hcc-chase-shor-c4715.unl.edu
                - ry-gpu-09.sdsc.optiputer.net
                - hcc-nrp-shor-c6017.unl.edu
                - gpu-18.nrp.mghpcc.org
                - nautilus-ext-gpu01.fullerton.edu
                - ry-gpu-03.sdsc.optiputer.net
                - uicnrp-fiona.evl.uic.edu
                - hcc-nrp-shor-c5825.unl.edu
                - fiona-prg1.cesnet.cz
                - nrp-01.laccd.edu
                - hcc-nrp-shor-c5925.unl.edu
                - ry-gpu-01.sdsc.optiputer.net
                - k8s-3090-01.usd.edu
                - k8s-chase-ci-07.calit2.optiputer.net
                - ry-gpu-02.sdsc.optiputer.net
                - hcc-chase-shor-c4705.unl.edu
                - ry-gpu-06.sdsc.optiputer.net
      containers:
      - name: protocol
        image: gitlab-registry.nrp-nautilus.io/smatous/yieldsat:image-v1
        imagePullPolicy: Always
        command: [/bin/bash, -c]
        args:
        - >-
          git clone --quiet https://github.com/SMATousi/geo-yield-prediction.git /workspace/code &&
          cd /workspace/code && git checkout --quiet "$YIELDSAT_GIT_REF" &&
          exec python yieldsat_tabm_cluster.py pool --units cluster/tabm/protocol_own3_units.json --concurrency 4
          --artifact_root /scratch/a --source_root /data/YieldSAT/preprocessed --stage_from /data/YieldSAT/owndata_artifacts
        env:
        - name: YIELDSAT_GIT_REF
          value: own-dataset-training
        resources:
          limits: {nvidia.com/gpu: 1, cpu: '6', memory: 20Gi, ephemeral-storage: 80Gi}
          requests: {nvidia.com/gpu: 1, cpu: '6', memory: 20Gi, ephemeral-storage: 80Gi}
        volumeMounts:
        - {name: data, mountPath: /data}
        - {name: scratch, mountPath: /scratch}
        - {name: dshm, mountPath: /dev/shm}
      volumes:
      - name: data
        persistentVolumeClaim: {claimName: ali-vol-1tera}
      - name: scratch
        emptyDir: {}
      - name: dshm
        emptyDir: {medium: Memory, sizeLimit: 4Gi}
