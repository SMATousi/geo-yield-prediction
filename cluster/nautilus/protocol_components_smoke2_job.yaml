# SMOKE 2 for the component ablation: any 24 GB GPU type, 6 CPU / 36 Gi (smoke 1 found no free A10/3090/4090 slot)
# + field context, + relation loss on all nine pairs x CV10/LOYO/LORO, seeds 0-2, 1,606 units. Sizing as the
# seeds job (4 runs per 24 GB GPU: ~100% GPU util, ~3 CPU per 3 runs). 20 GPUs, so ~80 runs at once. No credentials inside.
apiVersion: batch/v1
kind: Job
metadata:
  name: smatousi-yieldsat-protocol-components-smoke2
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 1000
  ttlSecondsAfterFinished: 604800
  template:
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values: [NVIDIA-A10, NVIDIA-GeForce-RTX-3090, NVIDIA-GeForce-RTX-4090, NVIDIA-L4, NVIDIA-TITAN-RTX, Quadro-RTX-6000, NVIDIA-RTX-A5000]
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                - hcc-chase-shor-c4715.unl.edu
                - ry-gpu-09.sdsc.optiputer.net
                - hcc-nrp-shor-c6017.unl.edu
                - gpu-18.nrp.mghpcc.org
                - nautilus-ext-gpu01.fullerton.edu
                - ry-gpu-03.sdsc.optiputer.net
                - uicnrp-fiona.evl.uic.edu
                - hcc-nrp-shor-c5825.unl.edu
                - fiona-prg1.cesnet.cz
                - nrp-01.laccd.edu
                - hcc-nrp-shor-c5925.unl.edu
                - ry-gpu-01.sdsc.optiputer.net
                - k8s-3090-01.usd.edu
                - k8s-chase-ci-07.calit2.optiputer.net
                - ry-gpu-02.sdsc.optiputer.net
                - hcc-chase-shor-c4705.unl.edu
                - ry-gpu-06.sdsc.optiputer.net
                - uicnrp-fiona2.evl.uic.edu
      containers:
      - name: protocol
        image: gitlab-registry.nrp-nautilus.io/smatous/yieldsat:image-v1
        imagePullPolicy: Always
        command: [/bin/bash, -c]
        args:
        - >-
          git clone --quiet https://github.com/SMATousi/geo-yield-prediction.git /workspace/code &&
          cd /workspace/code && git checkout --quiet "$YIELDSAT_GIT_REF" &&
          exec python yieldsat_tabm_cluster.py pool --units cluster/tabm/protocol_components_units.json --concurrency 6
          --artifact_root /scratch/a --source_root /data/YieldSAT/preprocessed --stage_from /data/YieldSAT/yieldsat_artifacts
        env:
        - name: YIELDSAT_GIT_REF
          value: own-dataset-training
        resources:
          limits: {nvidia.com/gpu: 1, cpu: '6', memory: 36Gi, ephemeral-storage: 80Gi}
          requests: {nvidia.com/gpu: 1, cpu: '6', memory: 36Gi, ephemeral-storage: 80Gi}
        volumeMounts:
        - {name: data, mountPath: /data}
        - {name: scratch, mountPath: /scratch}
        - {name: dshm, mountPath: /dev/shm}
      volumes:
      - name: data
        persistentVolumeClaim: {claimName: ali-vol-1tera}
      - name: scratch
        emptyDir: {}
      - name: dshm
        emptyDir: {medium: Memory, sizeLimit: 4Gi}
