# generated by yieldsat_cluster.py pools; no credentials inside
apiVersion: batch/v1
kind: Job
metadata:
  name: smatousi-yieldsat-dev-r1-a
spec:
  completions: 15
  parallelism: 15
  ttlSecondsAfterFinished: 604800
  template:
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values:
                - NVIDIA-A10
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                - hcc-chase-shor-c4715.unl.edu
                - ry-gpu-09.sdsc.optiputer.net
                - hcc-nrp-shor-c6017.unl.edu
                - gpu-18.nrp.mghpcc.org
                - nautilus-ext-gpu01.fullerton.edu
                - ry-gpu-03.sdsc.optiputer.net
                - uicnrp-fiona.evl.uic.edu
      containers:
      - name: yieldsat
        image: gitlab-registry.nrp-nautilus.io/smatous/yieldsat:image-v1
        imagePullPolicy: Always
        command:
        - /bin/bash
        - -c
        args:
        - git clone --quiet https://github.com/SMATousi/geo-yield-prediction.git /workspace/code && cd /workspace/code && git checkout --quiet "$YIELDSAT_GIT_REF" && exec cluster/nautilus/run_in_pod.sh
          pool --plan /data/YieldSAT/yieldsat_artifacts/cluster/dev_r1 --runs_per_gpu 2 --max_runs_per_gpu 2 --num_workers 4 --local_root /scratch/yieldsat --results_root /data/YieldSAT/yieldsat_results/dev_r1
        env:
        - name: YIELDSAT_GIT_REF
          value: main
        - name: YIELDSAT_SUITE
          value: cluster/suites/dev_r1.yaml
        - name: YIELDSAT_PLAN_DIR
          value: /data/YieldSAT/yieldsat_artifacts/cluster/dev_r1
        - name: YIELDSAT_SOURCE_ROOT
          value: /data/YieldSAT/preprocessed
        - name: YIELDSAT_ARTIFACT_ROOT
          value: /data/YieldSAT/yieldsat_artifacts
        - name: YIELDSAT_IMAGE_ROOT
          value: /data/YieldSAT/YieldSAT-Image-full
        - name: YIELDSAT_DONOR_ROOT
          value: /data/YieldSAT/yieldsat_results/image_donors
        - name: WANDB_API_KEY
          valueFrom:
            secretKeyRef:
              name: smatousi-wandb
              key: WANDB_API_KEY
        resources:
          limits:
            nvidia.com/gpu: 1
            cpu: '12'
            memory: 40Gi
            ephemeral-storage: 50Gi
          requests:
            nvidia.com/gpu: 1
            cpu: '12'
            memory: 40Gi
            ephemeral-storage: 50Gi
        volumeMounts:
        - name: data
          mountPath: /data
        - name: scratch
          mountPath: /scratch
        - name: dshm
          mountPath: /dev/shm
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: ali-vol-1tera
      - name: scratch
        emptyDir:
          sizeLimit: 40Gi
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 8Gi
  backoffLimit: 750
---
