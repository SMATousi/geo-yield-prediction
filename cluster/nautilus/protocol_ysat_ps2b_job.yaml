# ps2b (2026-11-01): replaces the queued half of ps2, whose pods were evicted at the 80 Gi ephemeral limit when
# they staged two countries (Argentina ~45 GB + Brazil ~35 GB with the windows); 160 Gi limit, pods prefer units
# whose country they already hold, --max_attempts 3 (an eviction leaves attempts at 2 without a gave_up).
# PlanetScope on all nine YieldSAT pairs (spec/yieldsat-planetscope.md): the Missouri-fixed arm (flat 3x3 + 30 m
# window) on the other six pairs under CV10 + LOYO and on all nine under LORO, 3 seeds, 495 units; 20 pods x 2 runs
# at 32 Gi as the first subset. The windows come from the second volume (smatousi-yieldsat-ps-1t, /data2), staged
# per unit (stage_ps). No credentials inside.
apiVersion: batch/v1
kind: Job
metadata:
  name: smatousi-yieldsat-protocol-ysat-ps2b
spec:
  completions: 10
  parallelism: 10
  backoffLimit: 1000
  ttlSecondsAfterFinished: 604800
  template:
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values: [NVIDIA-A10, NVIDIA-GeForce-RTX-3090, NVIDIA-GeForce-RTX-4090]
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                - hcc-chase-shor-c4715.unl.edu
                - ry-gpu-09.sdsc.optiputer.net
                - hcc-nrp-shor-c6017.unl.edu
                - gpu-18.nrp.mghpcc.org
                - nautilus-ext-gpu01.fullerton.edu
                - ry-gpu-03.sdsc.optiputer.net
                - uicnrp-fiona.evl.uic.edu
                - hcc-nrp-shor-c5825.unl.edu
                - fiona-prg1.cesnet.cz
                - nrp-01.laccd.edu
                - hcc-nrp-shor-c5925.unl.edu
                - ry-gpu-01.sdsc.optiputer.net
                - k8s-3090-01.usd.edu
                - k8s-chase-ci-07.calit2.optiputer.net
                - ry-gpu-02.sdsc.optiputer.net
                - hcc-chase-shor-c4705.unl.edu
                - ry-gpu-06.sdsc.optiputer.net
                - ry-gpu-08.sdsc.optiputer.net
      containers:
      - name: protocol
        image: gitlab-registry.nrp-nautilus.io/smatous/yieldsat:image-v1
        imagePullPolicy: Always
        command: [/bin/bash, -c]
        args:
        - >-
          git clone --quiet https://github.com/SMATousi/geo-yield-prediction.git /workspace/code &&
          cd /workspace/code && git checkout --quiet "$YIELDSAT_GIT_REF" &&
          exec python yieldsat_tabm_cluster.py pool --units cluster/tabm/protocol_ysat_ps2_units.json --concurrency 2 --max_attempts 3
          --artifact_root /scratch/a --source_root /data/YieldSAT/preprocessed --stage_from /data/YieldSAT/yieldsat_artifacts
        env:
        - name: YIELDSAT_GIT_REF
          value: own-dataset-training
        resources:
          limits: {nvidia.com/gpu: 1, cpu: '6', memory: 32Gi, ephemeral-storage: 160Gi}
          requests: {nvidia.com/gpu: 1, cpu: '6', memory: 32Gi, ephemeral-storage: 120Gi}
        volumeMounts:
        - {name: data, mountPath: /data}
        - {name: data2, mountPath: /data2}
        - {name: scratch, mountPath: /scratch}
        - {name: dshm, mountPath: /dev/shm}
      volumes:
      - name: data
        persistentVolumeClaim: {claimName: ali-vol-1tera}
      - name: data2
        persistentVolumeClaim: {claimName: smatousi-yieldsat-ps-1t}
      - name: scratch
        emptyDir: {}
      - name: dshm
        emptyDir: {medium: Memory, sizeLimit: 4Gi}
