# IC-C phase 3: field-context arrays from cache_dense_c<k> into neighbourhood_dense_c<k> (after phase 2).
# The chunked field-context build used 100-180 Mi at ~0.2 CPU, so 256 Mi; CPU measured 34-76m in the coarse build (2026-10-12) -> 100m. No credentials inside.
apiVersion: batch/v1
kind: Job
metadata:
  name: smatousi-yieldsat-coarse-fc
spec:
  completions: 3
  parallelism: 3
  completionMode: Indexed
  backoffLimit: 6
  ttlSecondsAfterFinished: 604800
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: build
        image: gitlab-registry.nrp-nautilus.io/smatous/yieldsat:image-v1
        imagePullPolicy: Always
        command: [/bin/bash, -c]
        args:
        - >-
          git clone --quiet https://github.com/SMATousi/geo-yield-prediction.git /workspace/code &&
          cd /workspace/code && git checkout --quiet "$YIELDSAT_GIT_REF" &&
          K=$(echo 2 3 6 | cut -d' ' -f$((JOB_COMPLETION_INDEX + 1))) && export YIELDSAT_NUM_SLOTS=72 &&
          YIELDSAT_CACHE_NAME=cache_dense_c$K YIELDSAT_NBR_NAME=neighbourhood_dense_c$K python yieldsat_build_field_context.py --artifact_root /data/YieldSAT/yieldsat_artifacts &&
          echo COARSE_FC_COMPLETE k=$K
        env:
        - name: YIELDSAT_GIT_REF
          value: main
        resources:
          limits: {cpu: '120m', memory: 300Mi, ephemeral-storage: 5Gi}
          requests: {cpu: '100m', memory: 256Mi, ephemeral-storage: 5Gi}
        volumeMounts:
        - {name: data, mountPath: /data}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values: [hpc-nrp-g1.nmsu.edu, tu.gp-engine.greatplains.net]
      volumes:
      - name: data
        persistentVolumeClaim: {claimName: ali-vol-1tera}
