# generated by yieldsat_cluster.py pools; no credentials inside
apiVersion: batch/v1
kind: Job
metadata:
  name: smatousi-yieldsat-before-full-province
spec:
  completions: 4
  parallelism: 4
  ttlSecondsAfterFinished: 604800
  template:
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values:
                - NVIDIA-A10
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                - hcc-chase-shor-c4715.unl.edu
                - ry-gpu-09.sdsc.optiputer.net
                - hcc-nrp-shor-c6017.unl.edu
                - gpu-18.nrp.mghpcc.org
      containers:
      - name: yieldsat
        image: gitlab-registry.nrp-nautilus.io/smatous/yieldsat:latest
        imagePullPolicy: Always
        command:
        - /bin/bash
        - -c
        args:
        - git clone --quiet https://github.com/SMATousi/geo-yield-prediction.git /workspace/code && cd /workspace/code && git checkout --quiet "$YIELDSAT_GIT_REF" && exec cluster/nautilus/run_in_pod.sh
          pool --plan /data/YieldSAT/yieldsat_artifacts/cluster/before_full --runs_per_gpu 4 --max_runs_per_gpu 6 --num_workers 1 --only protocol=loro-province --local_root /scratch/yieldsat --results_root
          /data/YieldSAT/yieldsat_results/before_full
        env:
        - name: YIELDSAT_GIT_REF
          value: main
        - name: YIELDSAT_SUITE
          value: cluster/suites/before_full.yaml
        - name: YIELDSAT_PLAN_DIR
          value: /data/YieldSAT/yieldsat_artifacts/cluster/before_full
        - name: YIELDSAT_SOURCE_ROOT
          value: /data/YieldSAT/preprocessed
        - name: YIELDSAT_ARTIFACT_ROOT
          value: /data/YieldSAT/yieldsat_artifacts
        - name: WANDB_API_KEY
          valueFrom:
            secretKeyRef:
              name: smatousi-wandb
              key: WANDB_API_KEY
        resources:
          limits:
            nvidia.com/gpu: 1
            cpu: '7'
            memory: 16Gi
            ephemeral-storage: 50Gi
          requests:
            nvidia.com/gpu: 1
            cpu: '7'
            memory: 16Gi
            ephemeral-storage: 50Gi
        volumeMounts:
        - name: data
          mountPath: /data
        - name: scratch
          mountPath: /scratch
        - name: dshm
          mountPath: /dev/shm
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: ali-vol-1tera
      - name: scratch
        emptyDir:
          sizeLimit: 40Gi
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 8Gi
  backoffLimit: 32
