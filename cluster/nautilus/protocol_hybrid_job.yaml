# Hybrid h1 follow-up for the paper-protocol image batch (spec/yieldsat-paper-protocol.md): the first image
# job's 2 Gi /dev/shm killed the hybrid's loader workers (bus error). 8 Gi shm (counts toward memory),
# 3 loader workers; claim ids __shm; units whose report already exists are skipped. No credentials inside.
apiVersion: batch/v1
kind: Job
metadata:
  name: smatousi-yieldsat-protocol-hybrid
spec:
  completions: 12
  parallelism: 12
  backoffLimit: 40
  ttlSecondsAfterFinished: 604800
  template:
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values: [NVIDIA-A10, NVIDIA-GeForce-RTX-3090, NVIDIA-GeForce-RTX-4090, NVIDIA-L40, NVIDIA-L40S,
                         NVIDIA-RTX-A6000, NVIDIA-A100-SXM4-80GB, NVIDIA-A100-PCIE-40GB, NVIDIA-A100-80GB-PCIe, NVIDIA-L4]
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                - hcc-chase-shor-c4715.unl.edu
                - ry-gpu-09.sdsc.optiputer.net
                - hcc-nrp-shor-c6017.unl.edu
                - gpu-18.nrp.mghpcc.org
                - nautilus-ext-gpu01.fullerton.edu
                - ry-gpu-03.sdsc.optiputer.net
                - uicnrp-fiona.evl.uic.edu
                - hcc-nrp-shor-c5825.unl.edu
                - fiona-prg1.cesnet.cz
                - nrp-01.laccd.edu
      containers:
      - name: protocol
        image: gitlab-registry.nrp-nautilus.io/smatous/yieldsat:image-v1
        imagePullPolicy: Always
        command: [/bin/bash, -c]
        args:
        - >-
          git clone --quiet https://github.com/SMATousi/geo-yield-prediction.git /workspace/code &&
          cd /workspace/code && git checkout --quiet "$YIELDSAT_GIT_REF" &&
          exec python yieldsat_tabm_cluster.py pool --units cluster/tabm/protocol_hybrid_shm_units.json
          --artifact_root /scratch/a --stage_from /data/YieldSAT/yieldsat_artifacts
          --stage_image_from /data/YieldSAT/YieldSAT-Image-full --image_local /scratch/img
        env:
        - name: YIELDSAT_GIT_REF
          value: main
        resources:
          limits: {nvidia.com/gpu: 1, cpu: '4', memory: 24Gi, ephemeral-storage: 80Gi}
          requests: {nvidia.com/gpu: 1, cpu: '4', memory: 24Gi, ephemeral-storage: 80Gi}
        volumeMounts:
        - {name: data, mountPath: /data}
        - {name: scratch, mountPath: /scratch}
        - {name: dshm, mountPath: /dev/shm}
      volumes:
      - name: data
        persistentVolumeClaim: {claimName: ali-vol-1tera}
      - name: scratch
        emptyDir: {}
      - name: dshm
        emptyDir: {medium: Memory, sizeLimit: 8Gi}
