# Flat-feature baselines on the dense series (spec/yieldsat-tabular-dense.md): LightGBM (CPU only, 8 threads) on the 5 small pairs; submit after the small flat matrices exist.
# No credentials inside.
apiVersion: batch/v1
kind: Job
metadata:
  name: smatousi-yieldsat-tab-dense-lgbm-small
spec:
  completions: 4
  parallelism: 4
  backoffLimit: 1000
  ttlSecondsAfterFinished: 604800
  template:
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                - hcc-chase-shor-c4715.unl.edu
                - ry-gpu-09.sdsc.optiputer.net
                - hcc-nrp-shor-c6017.unl.edu
                - gpu-18.nrp.mghpcc.org
                - nautilus-ext-gpu01.fullerton.edu
                - ry-gpu-03.sdsc.optiputer.net
                - uicnrp-fiona.evl.uic.edu
                - hcc-nrp-shor-c5825.unl.edu
                - fiona-prg1.cesnet.cz
                - nrp-01.laccd.edu
                - hcc-nrp-shor-c5925.unl.edu
                - ry-gpu-01.sdsc.optiputer.net
                - k8s-3090-01.usd.edu
                - k8s-chase-ci-07.calit2.optiputer.net
                - ry-gpu-02.sdsc.optiputer.net
                - hcc-chase-shor-c4705.unl.edu
                - ry-gpu-06.sdsc.optiputer.net
      containers:
      - name: protocol
        image: gitlab-registry.nrp-nautilus.io/smatous/yieldsat:image-v1
        imagePullPolicy: Always
        command: [/bin/bash, -c]
        args:
        - >-
          git clone --quiet https://github.com/SMATousi/geo-yield-prediction.git /workspace/code &&
          cd /workspace/code && git checkout --quiet "$YIELDSAT_GIT_REF" &&
          pip install --quiet --no-cache-dir tabm==0.0.3 rtdl_num_embeddings lightgbm &&
          exec python yieldsat_tabm_cluster.py pool --units cluster/tabm/protocol_tab_dense_lgbm_small_units.json
          --artifact_root /data/YieldSAT/yieldsat_artifacts --skip_gpu_check
        env:
        - name: YIELDSAT_GIT_REF
          value: main
        resources:
          limits: {cpu: '8', memory: 16Gi, ephemeral-storage: 20Gi}
          requests: {cpu: '8', memory: 16Gi, ephemeral-storage: 20Gi}
        volumeMounts:
        - {name: data, mountPath: /data}
        - {name: dshm, mountPath: /dev/shm}
      volumes:
      - name: data
        persistentVolumeClaim: {claimName: ali-vol-1tera}
      - name: dshm
        emptyDir: {medium: Memory, sizeLimit: 2Gi}
