# IC-C phase 1: coarsened-S2 caches cache_dense_c<k> (k = 2, 3, 6), one indexed pod per factor. Measured 150-280 Mi at
# 0.06-0.08 CPU (2026-10-12, I/O-bound), so 512 Mi / 100m CPU (the first 3 Gi / 1 CPU request was 5-9% used). No credentials inside.
apiVersion: batch/v1
kind: Job
metadata:
  name: smatousi-yieldsat-coarse-cache
spec:
  completions: 3
  parallelism: 3
  completionMode: Indexed
  backoffLimit: 6
  ttlSecondsAfterFinished: 604800
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: build
        image: gitlab-registry.nrp-nautilus.io/smatous/yieldsat:image-v1
        imagePullPolicy: Always
        command: [/bin/bash, -c]
        args:
        - >-
          git clone --quiet https://github.com/SMATousi/geo-yield-prediction.git /workspace/code &&
          cd /workspace/code && git checkout --quiet "$YIELDSAT_GIT_REF" &&
          K=$(echo 2 3 6 | cut -d' ' -f$((JOB_COMPLETION_INDEX + 1))) && export YIELDSAT_NUM_SLOTS=72 &&
          python yieldsat_build_coarse.py --artifact_root /data/YieldSAT/yieldsat_artifacts --factor $K &&
          echo COARSE_CACHE_COMPLETE k=$K
        env:
        - name: YIELDSAT_GIT_REF
          value: main
        resources:
          limits: {cpu: '120m', memory: 600Mi, ephemeral-storage: 5Gi}
          requests: {cpu: '100m', memory: 512Mi, ephemeral-storage: 5Gi}
        volumeMounts:
        - {name: data, mountPath: /data}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values: [hpc-nrp-g1.nmsu.edu, tu.gp-engine.greatplains.net]
      volumes:
      - name: data
        persistentVolumeClaim: {claimName: ali-vol-1tera}
