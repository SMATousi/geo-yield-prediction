# Dense raw S2 series build on the PVC (spec/yieldsat-dense-series.md, DS-04): yieldsat_build_dense.py for all
# four countries from /data/YieldSAT/Raw.zip into yieldsat_artifacts/cache_dense, then the dense 5x5
# neighbourhood stream. CPU only. Workers read zip members by offset straight from the PVC (a scratch copy
# hit a read failure; the per-worker zip-directory parsing that made PVC reads slow is gone). Sized from local measurement after the memory fixes (Argentina: dense build 2.3 GiB PSS with 12
# workers, neighbourhood 7.7 GiB). No credentials inside.
apiVersion: batch/v1
kind: Job
metadata:
  name: smatousi-yieldsat-dense-build
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 2
  ttlSecondsAfterFinished: 604800
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: build
        image: gitlab-registry.nrp-nautilus.io/smatous/yieldsat:image-v1
        imagePullPolicy: Always
        command: [/bin/bash, -c]
        args:
        - >-
          git clone --quiet https://github.com/SMATousi/geo-yield-prediction.git /workspace/code &&
          cd /workspace/code && git checkout --quiet "$YIELDSAT_GIT_REF" &&
          (python -c "import rasterio" 2>/dev/null || pip install --quiet --no-cache-dir rasterio) &&
          python yieldsat_build_dense.py --raw_zip /data/YieldSAT/Raw.zip
          --artifact_root /data/YieldSAT/yieldsat_artifacts --workers 12 &&
          YIELDSAT_NUM_SLOTS=72 YIELDSAT_CACHE_NAME=cache_dense YIELDSAT_NBR_NAME=neighbourhood_dense
          python yieldsat_build_neighbourhood.py --artifact_root /data/YieldSAT/yieldsat_artifacts &&
          echo DENSE_BUILD_COMPLETE
        env:
        - name: YIELDSAT_GIT_REF
          value: main
        resources:
          limits: {cpu: '12', memory: 12Gi, ephemeral-storage: 5Gi}
          requests: {cpu: '12', memory: 12Gi, ephemeral-storage: 5Gi}
        volumeMounts:
        - {name: data, mountPath: /data}
      volumes:
      - name: data
        persistentVolumeClaim: {claimName: ali-vol-1tera}
