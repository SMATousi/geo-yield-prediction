# Component ablation (tab:ablation), third sizing, 2026-11-04. The interleaved units made every pod stage all four
# countries' dense caches (~35 GB with neighbourhoods); in right-sized pods (14/24 Gi) they no longer fit in the page
# cache and the runs waited on disk (io pressure 88-96%, 0-4 units per pod in 8 h vs 18-20 in an unpressured 40 Gi pod).
# Now each pod holds one country at a time (pool --one_country). Page cache needed: Argentina 24 G, Brazil 19 G,
# Uruguay 10 G, Germany 3 G. The cluster counts owned memory (anon, ~1.8 G per run + ~0.6 G shm), not page cache:
#   _l2: 22-60 GB GPUs, 8 runs, 12 CPU / 48 Gi (anon ~14 G = 29%)
#   _m : 15-21 GB GPUs, 6 runs,  9 CPU / 40 Gi (anon ~11 G = 27%)
#   _s2: < 14 GB GPUs, 3 runs, Germany and Uruguay only, 5 CPU / 18 Gi (anon ~5.4 G = 30%)
# Same units and claims as the earlier components jobs. No credentials inside.
apiVersion: batch/v1
kind: Job
metadata:
  name: smatousi-yieldsat-protocol-components-s2
spec:
  completions: 7
  parallelism: 7
  backoffLimit: 1000
  ttlSecondsAfterFinished: 604800
  template:
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.memory
                operator: Lt
                values: ['14000']
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                - hcc-chase-shor-c4715.unl.edu
                - ry-gpu-09.sdsc.optiputer.net
                - hcc-nrp-shor-c6017.unl.edu
                - gpu-18.nrp.mghpcc.org
                - nautilus-ext-gpu01.fullerton.edu
                - ry-gpu-03.sdsc.optiputer.net
                - uicnrp-fiona.evl.uic.edu
                - hcc-nrp-shor-c5825.unl.edu
                - fiona-prg1.cesnet.cz
                - nrp-01.laccd.edu
                - hcc-nrp-shor-c5925.unl.edu
                - ry-gpu-01.sdsc.optiputer.net
                - k8s-3090-01.usd.edu
                - k8s-chase-ci-07.calit2.optiputer.net
                - ry-gpu-02.sdsc.optiputer.net
                - hcc-chase-shor-c4705.unl.edu
                - ry-gpu-06.sdsc.optiputer.net
                - uicnrp-fiona2.evl.uic.edu
                - k8s-haosu-05.sdsc.optiputer.net
      containers:
      - name: protocol
        image: gitlab-registry.nrp-nautilus.io/smatous/yieldsat:image-v1
        imagePullPolicy: Always
        command: [/bin/bash, -c]
        args:
        - >-
          git clone --quiet https://github.com/SMATousi/geo-yield-prediction.git /workspace/code &&
          cd /workspace/code && git checkout --quiet "$YIELDSAT_GIT_REF" &&
          GMB=$(nvidia-smi --query-gpu=memory.total --format=csv,noheader,nounits | head -1) &&
          CONC=3 && echo "GPU $GMB MiB -> concurrency $CONC" &&
          exec python yieldsat_tabm_cluster.py pool --units cluster/tabm/protocol_components_units.json --concurrency $CONC --one_country --countries Germany,Uruguay
          --artifact_root /scratch/a --source_root /data/YieldSAT/preprocessed --stage_from /data/YieldSAT/yieldsat_artifacts
        env:
        - name: YIELDSAT_GIT_REF
          value: own-dataset-training
        resources:
          limits: {nvidia.com/gpu: 1, cpu: '5', memory: 18Gi, ephemeral-storage: 80Gi}
          requests: {nvidia.com/gpu: 1, cpu: '5', memory: 18Gi, ephemeral-storage: 80Gi}
        volumeMounts:
        - {name: data, mountPath: /data}
        - {name: scratch, mountPath: /scratch}
        - {name: dshm, mountPath: /dev/shm}
      volumes:
      - name: data
        persistentVolumeClaim: {claimName: ali-vol-1tera}
      - name: scratch
        emptyDir: {}
      - name: dshm
        emptyDir: {medium: Memory, sizeLimit: 4Gi}
