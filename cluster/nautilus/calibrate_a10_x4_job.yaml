# generated by yieldsat_cluster.py k8s; no credentials inside
apiVersion: batch/v1
kind: Job
metadata:
  name: smatousi-yieldsat-calibrate-a10-x4
spec:
  completionMode: Indexed
  completions: 1
  parallelism: 1
  backoffLimitPerIndex: 2
  maxFailedIndexes: 1
  ttlSecondsAfterFinished: 604800
  template:
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values:
                - NVIDIA-A10
      containers:
      - name: yieldsat
        image: gitlab-registry.nrp-nautilus.io/smatous/yieldsat:latest
        imagePullPolicy: Always
        command:
        - /bin/bash
        - -c
        args:
        - git clone --quiet https://github.com/SMATousi/geo-yield-prediction.git /workspace/code && cd /workspace/code && git checkout --quiet "$YIELDSAT_GIT_REF" && exec cluster/nautilus/run_in_pod.sh
          run --plan /data/YieldSAT/yieldsat_artifacts/cluster/calibrate_a10_x4 --local_root /scratch/yieldsat --results_root /data/YieldSAT/yieldsat_results/calibrate_a10_x4
        env:
        - name: YIELDSAT_GIT_REF
          value: main
        - name: YIELDSAT_SUITE
          value: cluster/suites/calibrate_a10_x4.yaml
        - name: YIELDSAT_PLAN_DIR
          value: /data/YieldSAT/yieldsat_artifacts/cluster/calibrate_a10_x4
        - name: YIELDSAT_SOURCE_ROOT
          value: /data/YieldSAT/preprocessed
        - name: YIELDSAT_ARTIFACT_ROOT
          value: /data/YieldSAT/yieldsat_artifacts
        - name: WANDB_API_KEY
          valueFrom:
            secretKeyRef:
              name: smatousi-wandb
              key: WANDB_API_KEY
        resources:
          limits:
            nvidia.com/gpu: 1
            cpu: '16'
            memory: 48Gi
            ephemeral-storage: 50Gi
          requests:
            nvidia.com/gpu: 1
            cpu: '16'
            memory: 48Gi
            ephemeral-storage: 50Gi
        volumeMounts:
        - name: data
          mountPath: /data
        - name: scratch
          mountPath: /scratch
        - name: dshm
          mountPath: /dev/shm
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: ali-vol-1tera
      - name: scratch
        emptyDir:
          sizeLimit: 40Gi
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 8Gi
