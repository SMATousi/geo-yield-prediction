# YieldSAT "before knowledge pretraining" suite (spec/yieldsat_cluster_runs.md).
# Every paper pair x CV10/LORO/LOYO x {paper, strict} policy x {S2, S2+ADM}
# x 3 seeds for our model, plus the paper-LSTM re-run baseline (CV10).
suite: before_full
wandb:
  project: yieldsat-cvpr27          # API key: WANDB_API_KEY from the job YAML
  entity: null                      # set to the team/user entity if needed
data:
  source_root: ${YIELDSAT_SOURCE_ROOT}      # shared: <DATA_DIR>/Preprocessed
  artifact_root: ${YIELDSAT_ARTIFACT_ROOT}  # shared: index, cache, geometry, splits
pairs: all
job_unit: pair_shard          # pair = one job per country-crop; pair_shard splits big pairs
target_job_hours: 4.0         # shard size target for pair_shard
runs_per_gpu: 4               # starting concurrency (worker pools override per GPU type)
max_runs_per_gpu: 6           # adaptive ceiling
target_gpu_util: 80           # add a run whenever GPU utilization < 80% (and memory allows)
num_workers: 3                # DataLoader workers per run
# Worker pools (spec §12): A10 16 CPU/48 GiB, 4->6 runs (measured 96% util);
# RTX 3090 6 CPU/24 GiB, 3->5 runs (measured 88% util, adaptive from 2).
# The training recipe (batch 512, lr 1e-3) is identical on both GPU types.
# Measured on Nautilus A10 pods (16 CPU), 2026-09-29, ARG-S S2+ADM, 4 concurrent
# runs: 6.93k samples/s per run for our model (= 0.226 x the RTX 3090 single-run
# reference), test inference ~43k cells/s per run; the paper LSTM ran at 41k
# samples/s with 2 concurrent runs (0.29x), 0.2 assumed at 4. With per-run
# factors, the concurrency speed-up is the run count itself.
gpu_speed_factor: {ours: 0.226, paper_lstm: 0.2, test: 0.27}
concurrency_speedup: 4.0
stage_mb_per_s: 42            # CephFS -> pod scratch (Argentina 11 GB in 261 s)
experiments:
  - name: ours                # our point model, default fusion (YS-11 decision)
    model: ours
    fusion: perceiver_summary
    protocols: [cv, loro, loyo]
    policies: [paper, strict]
    inputs: [s2, s2_adm]
    seeds: [0, 1, 2]
    # increased budget: 60 epochs of one pass over the fold's training cells,
    # clamped to 500..1500 steps of 512 (3x the previous 20 x 500)
    budget: {epochs: 60, steps_per_epoch: 0, min_steps_per_epoch: 500, max_steps_per_epoch: 1500}
  - name: paper_lstm          # paper LSTM re-run (PC-05 preset: 15 full passes)
    model: paper_lstm
    protocols: [cv]
    policies: [paper]
    inputs: [s2, s2_adm]
    seeds: [0]
