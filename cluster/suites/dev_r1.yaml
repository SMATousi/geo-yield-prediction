# Improvement plan round 1 on the DEV subset (spec/yieldsat-improvement.md):
# hybrid model variants E1-E6 (S4 early fusion, S5 level term, S6 local context,
# S10 S2/DEM maps, S9 DEM<->RGB cross-attention, S7 augmentation) on ARG-W, BRA-C,
# GER-R, URG-S x CV10/LOYO/LORO (provinces for ARG-W) x paper policy x S2+ADM x seed 0.
# Recipe from the local calibration: 80 epochs, 8 tiles per batch, lr 2e-3, all tiles.
suite: dev_r1
wandb:
  project: yieldsat-cvpr27-improve
  entity: null
data:
  source_root: ${YIELDSAT_SOURCE_ROOT}
  artifact_root: ${YIELDSAT_ARTIFACT_ROOT}
  image_root: ${YIELDSAT_IMAGE_ROOT}
  stage_mode: sparse
pairs:
- ARG-W
- BRA-C
- GER-R
- URG-S
job_unit: pair_shard
target_job_hours: 2.0
runs_per_gpu: 3
max_runs_per_gpu: 4
target_gpu_util: 80
num_workers: 3
gpu_speed_factor:
  image: 0.32
concurrency_speedup: 3.0
stage_mb_per_s: 42
experiments:
- name: h1-early
  model: image
  policies: &id001
  - paper
  inputs: &id002
  - s2_adm
  seeds: &id003
  - 0
  budget: &id004
    epochs: 80
    batch_size: 8
    lr: 0.002
  extra_args: &id005
  - --arch
  - hybrid
  - --slot_coverage
  - present
  - --cell_fusion
  - early
  protocols:
  - cv
  - loyo
- name: h1-early
  model: image
  policies: *id001
  inputs: *id002
  seeds: *id003
  budget: *id004
  extra_args: *id005
  protocols:
  - loro
  pairs:
  - BRA-C
  - GER-R
  - URG-S
- name: h1-early
  model: image
  policies: *id001
