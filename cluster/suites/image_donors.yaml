# YieldSAT image model: warm-start donors (spec/yieldsat-image-training.md, YI-06).
# Pairs with < 100 tiles (GER-R 41, GER-W 27) fine-tune from a donor trained on
# other countries only, so no target-fold data is seen:
#   bra-w   all BRA-W tiles (same crop, wheat country with most tiles) -> GER-W
#   pooled  all non-German tiles, all crops (crop token on)            -> GER-R
# One run per donor x inputs x seed; each keeps checkpoint_best.pth in the
# results root, which image_full's warm_start reads (data.donor_root).
suite: image_donors
wandb:
  project: yieldsat-cvpr27-image
  entity: null
data:
  source_root: ${YIELDSAT_SOURCE_ROOT}
  artifact_root: ${YIELDSAT_ARTIFACT_ROOT}
  image_root: ${YIELDSAT_IMAGE_ROOT}         # 64x64 tiles + dino_cache/<rev>_<prep>/
pairs: []
job_unit: pair_shard
target_job_hours: 2.0
runs_per_gpu: 2                # image runs are loader-bound (~1 GB GPU each)
max_runs_per_gpu: 4
target_gpu_util: 80
num_workers: 3
gpu_speed_factor: {image: 1.0} # calibrate from the Nautilus smoke run (YI-08)
concurrency_speedup: 2.0
stage_mb_per_s: 42
experiments:
  - name: donor
    model: image
    donors:
      - {name: bra-w, countries: [Brazil], crops: [wheat]}
      - {name: pooled, countries: [Argentina, Brazil, Uruguay]}
    inputs: [s2, s2_adm]
    seeds: [0, 1, 2]
