# Improvement plan round 2(a) on the DEV subset (spec/yieldsat-improvement.md): the point
# model (field-balanced cell sampling, which beat every round-1 hybrid) with S4 early fusion,
# S5 season-level term and S6 5x5 neighbourhood S2 stream, alone and combined. Same DEV
# subset/matrix as round 1; budget as the point suite (before_full).
suite: dev_r2
wandb:
  project: yieldsat-cvpr27-improve
  entity: null
data:
  source_root: ${YIELDSAT_SOURCE_ROOT}
  artifact_root: ${YIELDSAT_ARTIFACT_ROOT}
pairs:
- ARG-W
- BRA-C
- GER-R
- URG-S
job_unit: pair_shard
target_job_hours: 3.0
runs_per_gpu: 4
max_runs_per_gpu: 6
target_gpu_util: 80
num_workers: 1
gpu_speed_factor:
  ours: 0.226
  paper_lstm: 0.2
  test: 0.27
concurrency_speedup: 4.0
stage_mb_per_s: 42
